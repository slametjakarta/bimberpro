[hidden]{display:none!important}

body.busy{cursor:progress}
button,input,select{font:inherit;color:inherit}
.mut{color:var(--mut)}
.brand{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.brand b{color:var(--pri)}
.brand img{width:38px;height:38px;border-radius:10px;object-fit:cover}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--pri);vertical-align:middle}
.lgprev{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--bd)}
.logo{background:linear-gradient(135deg,#D4AF37,#996515);color:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lg{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;padding:28px}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.02em}
input,select{height:40px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);outline:none;font-weight:400}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(184,134,11,.18)}
input[type=file]{padding-top:8px}
textarea{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);font:inherit;color:inherit;outline:none;resize:vertical}
textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(184,134,11,.18)}
.btn{height:40px;padding:0 16px;border:0;border-radius:8px;background:var(--pri);color:var(--onpri);font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--pri2)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn.sec:hover{background:var(--th)}
.btn.sm{height:32px;padding:0 12px;font-size:12px}
.btn.bad{background:transparent;border:1px solid #DC2626;color:#DC2626}
.sb{position:fixed;inset:0 auto 0 0;width:260px;background:var(--sb);border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column;gap:20px;z-index:20;transition:transform .25s}
#nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto;margin:0 -6px;padding:0 6px;scrollbar-width:thin}
#nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;color:var(--tx);text-decoration:none;font-weight:500;cursor:pointer}
#nav a:hover{background:var(--th)}
#nav a.on{background:var(--gold);color:#fff;font-weight:600}
[data-theme=dark] #nav a.on{color:#271900;background:var(--pri)}
main{margin-left:260px;padding:0 32px 32px;max-width:1440px}
.top{display:flex;align-items:center;gap:12px;padding:20px 0}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.02em;flex:1;border-left:4px solid var(--pri);padding-left:12px}
.menu{display:none;background:none;border:0;font-size:26px;cursor:pointer}
.pill{background:var(--sec);border-radius:999px;padding:4px 14px;font-size:12px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:20px;margin-bottom:20px}
.card h3{font-size:16px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--pri);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh)}
.kpi.c1{border-left-color:var(--teal)}.kpi.c2{border-left-color:#1E293B}.kpi.c3{border-left-color:#DC2626}
.kpi span{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums}
.ins{display:flex;gap:10px;align-items:center;background:var(--sec)}
.cv{position:relative;height:300px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{background:var(--th);text-align:left;padding:10px 14px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--bd);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:hover td{background:var(--rowh)}
.empty{text-align:center;color:var(--mut);padding:24px}
.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-size:11px;font-weight:600}
.ok{background:#DCFCE7;color:#166534}.warn{background:#FEF9C3;color:#854D0E}.bad2{background:#FEE2E2;color:#991B1B}.info{background:var(--sec);color:var(--tx)}
.acts{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.srch{max-width:280px;margin-bottom:12px;width:100%}
#toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.t{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--teal);border-radius:8px;padding:12px 16px;box-shadow:0 8px 20px rgba(15,23,42,.15);max-width:320px}
.t.err{border-left-color:#DC2626}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:50;padding:16px}
.mc{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:720px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.mc iframe{width:100%;height:60vh;border:0;border-radius:8px}
@media(max-width:900px){.sb{transform:translateX(-100%)}.sb.open{transform:none;box-shadow:0 0 0 100vmax rgba(15,23,42,.4)}main{margin-left:0;padding:0 16px 24px}.menu{display:block}.top h1{font-size:20px}}
.chat{display:grid;grid-template-columns:280px 1fr;gap:16px;height:calc(100vh - 150px);min-height:420px}
.cl{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:auto}
.ci{padding:12px 14px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;flex-direction:column;gap:2px}

.ch{padding:12px 16px;font-weight:600;border-bottom:1px solid var(--bd)}

.gh span{flex:1}

</div>

const thisPeriod = () => new Date().toISOString().slice(0,7);

function scope() {
  if (ROLE === 'admin') return { kIds:DB.kelas.map(k=>k.kelas_id), sIds:DB.siswa.map(s=>s.siswa_id) };
  if (ROLE === 'pengajar') {
    const u = USERS.guru1, kIds = DB.kelas.filter(k=>k.pengajar_id===u.ref_id).map(k=>k.kelas_id);
    return { kIds, sIds: DB.siswa.filter(s=>kIds.includes(s.kelas_id)).map(s=>s.siswa_id) };
  }
  const me = DB.siswa.find(s=>s.siswa_id===USERS[ROLE==='siswa'?'siswa1':'siswa1'].ref_id);
  const u = Object.values(USERS).find(x=>x.role===ROLE) || USERS.siswa1;
  const kIds = me ? [me.kelas_id] : [];
  DB.paket.filter(p=>p.siswa_id===u.ref_id && p.status==='aktif').forEach(p=>kIds.push(p.kelas_id));
  return { kIds:[...new Set(kIds)], sIds:[u.ref_id] };
}

const call = (fn, a) => {
  try {
    switch(fn){
      case 'doLogin': {
        const un = String(a[0]||'').trim().toLowerCase();
        const u = USERS[un];
        if (!u) return err('Mode demo: gunakan username admin, guru1, siswa1, atau siswa2 (password bebas).');
        ROLE = u.role;
        return ok({ token:'demo-'+un, user:u });
      }
      case 'doLogout': return ok(null);
      case 'getIdentitas': return ok(DB.identitas);
      case 'getKelasPublik': return ok(DB.kelas.map(k=>({kelas_id:k.kelas_id, nama_kelas:k.nama_kelas, biaya:k.biaya, ringkasan:k.ringkasan})));

      case 'getPage': return getPage(a[0]);
      case 'getLaporan': return ok(laporan_(a[0] || thisPeriod()));

      case 'kontakChat': return ok(kontakChat_());
      case 'ambilPesan': return ok(ambilPesan_(a[0]));
      case 'kirimPesan': return kirimPesan_(a[0], a[1]);
      case 'jmlUnread': return ok(jmlUnread_());

      case 'setBayar': return setBayar_(a[0], a[1]);
      case 'uploadBukti': return uploadBukti_(a[0], a[1], a[2], a[3], a[4]);
      case 'saveNilai': return saveNilai_(a[0]);
      case 'konfirmasiSiswa': return konfirmasiSiswa_(a[0], a[1]);
      case 'tambahPengajar': return tambahPengajar_(a[0]);
      case 'setPengajarKelas': return setPengajarKelas_(a[0], a[1]);
      case 'tambahJadwal': return tambahJadwal_(a[0]);
      case 'hapusJadwal': return hapusJadwal_(a[0]);
      case 'simpanRekening': return simpanRekening_(a[0]);
      case 'getRekening': return ok(DB.pengajar.find(p=>p.pengajar_id==='P1') || {});
      case 'simpanPaket': return simpanPaket_(a[0]);
      case 'hapusPaket': return hapusPaket_(a[0]);
      case 'ajukanPaket': return ajukanPaket_(a[0]);
      case 'putusPaket': return putusPaket_(a[0], a[1]);
      case 'simpanIdentitas': return simpanIdentitas_(a[0]);
      case 'simpanPengaturan': return simpanPengaturan_(a[0]);
      case 'resetPassword': return ok(null, 'Mode demo: password tidak benar-benar direset.');
      case 'tambahAdmin': return ok(null, 'Mode demo: admin baru tidak benar-benar ditambahkan.');
      case 'editAkun': return editAkun_(a[0]);
      case 'hapusAkun': return ok(null, 'Mode demo: akun tidak benar-benar dihapus.');
      case 'simpanFoto': return ok({ foto:'', self:true }, 'Mode demo: foto tidak disimpan.');
      case 'gantiPassword': return ok(null, 'Mode demo: password tidak diubah.');
      case 'simpanMateri': return simpanMateri_(a[0]);
      case 'tandaiMateri': return tandaiMateri_(a[0]);
      case 'bayarGaji': return bayarGaji_(a[0]);
      case 'selesaikanAdmin': return selesaikanAdmin_(a[0]);
      case 'jawabSelesai': return jawabSelesai_(a[0], a[1]);
      case 'simpanBiaya': return simpanBiaya_(a[0]);
      case 'hapusBiaya': return hapusBiaya_(a[0]);
      case 'kirimChunk': return err('Mode demo: unggah video tidak tersedia.');
      case 'mulaiVideo': return err('Mode demo: unggah video tidak tersedia.');
      case 'infoDrive': return ok({ root:'https://drive.google.com/drive/folders/demo', db:'https://docs.google.com/spreadsheets/d/demo', used:2.5e9, limit:15e9,
        folders:['Bukti_Bayar','Foto_Profil','Logo','Materi','Video','Kuitansi_PDF','Rapor_PDF','Backup','Bukti_Gaji','Bukti_Biaya'].map(n=>({nama:n, url:'https://drive.google.com/drive/folders/demo'})) });
      case 'cadangkanDB': return ok({ url:'https://drive.google.com/drive/folders/demo' }, 'Mode demo: cadangan tidak dibuat.');
      case 'jalankanPengingat': return ok(null, 'Mode demo: pengingat tidak dikirim.');
      case 'daftarPublik': return daftarPublik_(a[0]);
      case 'unduhKuitansi': return err('Mode demo: unduh PDF tidak tersedia.');
      case 'emailKuitansi': return ok(null, 'Mode demo: email tidak dikirim.');
      case 'waKuitansi': return waKuitansi_(a[0]);
      case 'unduhLaporan': return err('Mode demo: unduh PDF tidak tersedia.');
      case 'unduhRapor': return err('Mode demo: unduh PDF tidak tersedia.');
      case 'emailRapor': return ok(null, 'Mode demo: email tidak dikirim.');
      default: return err('Fungsi '+fn+' belum diimplementasikan di demo.');
    }
  } catch(e) { return err(e.message); }
};

function getPage(page) {
  const sc = scope();
  const nm = Object.fromEntries(DB.siswa.map(s=>[s.siswa_id, s.nama]));
  const kn = Object.fromEntries(DB.kelas.map(k=>[k.kelas_id, k.nama_kelas]));

  if (page === 'chat') return ok({});
  if (page === 'selesai') return selesaiPage_();
  if (page === 'siswa') {
    if (ROLE !== 'admin') return err('Akses ditolak.');
    return ok({ siswa: DB.siswa, paket: DB.paket.filter(p=>p.status==='menunggu') });
  }
  if (page === 'pengajar') {
    if (ROLE !== 'admin') return err('Akses ditolak.');
    return ok({ pengajar: DB.pengajar });
  }
  if (page === 'paketkelola') {
    if (ROLE !== 'admin') return err('Akses ditolak.');
    return ok({ pengajar: DB.pengajar, kelas: DB.kelas });
  }
  if (page === 'identitas') {
    if (ROLE !== 'admin') return err('Akses ditolak.');
    return ok(DB.identitas);
  }
  if (page === 'laporan') {
    if (ROLE !== 'admin') return err('Akses ditolak.');
    return ok(laporan_(thisPeriod()));
  }
  if (page === 'gaji') {
    if (ROLE !== 'admin') return err('Akses ditolak.');
    return ok({ periode: thisPeriod(), gaji: DB.gaji });
  }
  if (page === 'pengaturan') {
    if (ROLE !== 'admin') return err('Akses ditolak.');
    return ok({ cfg: DB.pengaturan, users: DB.users });
  }
  if (page === 'penjadwalan') {
    if (ROLE !== 'admin') return err('Akses ditolak.');
    return ok({ jadwal: DB.jadwal, kelas: DB.kelas, pengajar: DB.pengajar });
  }

  const pay = ROLE === 'pengajar' ? [] : DB.pembayaran.filter(p=>sc.sIds.includes(p.siswa_id));
  const jadwal = DB.jadwal.filter(j=>sc.kIds.includes(j.kelas_id));
  const nilai = DB.nilai.filter(n=>sc.kIds.includes(n.kelas_id) && sc.sIds.includes(n.siswa_id));

  if (page === 'pembayaran') {
    if (ROLE === 'pengajar') return err('Akses ditolak.');
    return ok({ pay });
  }
  if (page === 'kuitansi') {
    if (ROLE !== 'siswa') return err('Akses ditolak.');
    return ok({ pay: pay.filter(p=>p.status==='terverifikasi') });
  }
  if (page === 'jadwal') return ok({ jadwal });
  if (page === 'paket') {
    if (ROLE !== 'siswa') return err('Akses ditolak.');
    const u = Object.values(USERS).find(x=>x.role==='siswa') || USERS.siswa1;
    const pk = DB.paket.filter(p=>p.siswa_id===u.ref_id && p.status==='menunggu');
    return ok({ kelas: DB.kelas.map(x=>({ kelas_id:x.kelas_id, nama_kelas:x.nama_kelas, tipe:x.tipe, biaya:x.biaya, ringkasan:x.ringkasan,
      status: sc.kIds.includes(x.kelas_id) ? 'aktif' : pk.some(p=>p.kelas_id===x.kelas_id) ? 'menunggu' : 'tersedia' })) });
  }
  if (page === 'materi') {
    const u = Object.values(USERS).find(x=>x.role===ROLE) || {};
    const selesai = ROLE==='siswa' ? DB.materiSelesai.filter(x=>x.siswa_id===u.ref_id).map(x=>x.materi_id) : [];
    return ok({ selesai, materi: DB.materi.filter(x=>sc.kIds.includes(x.kelas_id)), kelas: DB.kelas.filter(k=>sc.kIds.includes(k.kelas_id)) });
  }
  if (page === 'nilai') {
    return ok({ nilai, siswa: DB.siswa.filter(s=>sc.sIds.includes(s.siswa_id)), kelas: DB.kelas.filter(k=>sc.kIds.includes(k.kelas_id)) });
  }

  // dashboard
  const okPay = pay.filter(p=>p.status==='terverifikasi');
  const avg = nilai.length ? (nilai.reduce((a,n)=>a+n.skor,0)/nilai.length).toFixed(1) : '-';
  let kpis, chart = null;
  if (ROLE === 'admin') {
    const by = {};
    okPay.forEach(p=>by[p.periode]=(by[p.periode]||0)+p.jumlah);
    const labels = Object.keys(by).sort();
    chart = { labels, values: labels.map(l=>by[l]) };
    kpis = [['Siswa Aktif', DB.siswa.filter(s=>s.status_daftar==='aktif').length], ['Pengajar', DB.pengajar.length],
      ['Pemasukan SPP', okPay.reduce((a,p)=>a+p.jumlah,0), 'rp'], ['Menunggu Verifikasi', pay.filter(p=>p.status==='menunggu').length]];
  } else if (ROLE === 'pengajar') {
    kpis = [['Kelas Diampu', sc.kIds.length], ['Siswa', sc.sIds.length], ['Sesi Mingguan', jadwal.length], ['Rata-rata Nilai', avg]];
  } else {
    kpis = [['Pembayaran Menunggu', pay.filter(p=>p.status==='menunggu').length], ['Sesi Mingguan', jadwal.length], ['Rata-rata Nilai', avg]];
  }
  const insight = ROLE === 'admin'
    ? `${pay.filter(p=>p.status==='menunggu').length} pembayaran menunggu verifikasi; total terverifikasi Rp ${okPay.reduce((a,p)=>a+p.jumlah,0).toLocaleString('id-ID')}.`
    : `Rata-rata nilai Anda saat ini ${avg}.`;
  const kuitansi = ROLE==='siswa' ? okPay.slice(0,3) : [];
  return ok({ kpis, chart, insight, kuitansi });
}

  return ok(null, 'Status pembayaran diperbarui (demo).');
}

  if (o.kelas_id) {

    k.nama_kelas = o.nama; k.tipe = o.tipe; k.biaya = Number(o.harga); k.kuota = Number(o.kuota); k.ringkasan = o.ringkasan; k.pengajar_id = o.pengajar_id;

    return ok(null, 'Paket diperbarui (demo).');

  const p = DB.pengajar.find(x=>x.pengajar_id===o.pengajar_id);
  DB.kelas.push({ kelas_id:uid('K'), nama_kelas:o.nama, tipe:o.tipe, pengajar_id:o.pengajar_id, pengajar:p?p.nama:'-', biaya:Number(o.harga), kuota:Number(o.kuota), terisi:0, status:'tersedia', ringkasan:o.ringkasan });

function laporan_(per) {
  const mon = d => String(d).slice(0,7);
  const pay = DB.pembayaran.filter(p=>p.status==='terverifikasi');
  const gj = DB.gaji.filter(g=>g.status==='dibayar');
  const bi = DB.biaya;
  const sPay = m => pay.filter(p=>mon(p.tgl)===m).reduce((a,p)=>a+Number(p.jumlah),0);
  const sGaji = m => gj.filter(g=>mon(g.tgl_bayar||'')===m).reduce((a,g)=>a+Number(g.total),0);
  const sBi = (m,kat) => bi.filter(b=>mon(b.tgl)===m && (!kat || b.kategori===kat)).reduce((a,b)=>a+Number(b.jumlah),0);
  const out = { periode:per, pendapatan:sPay(per), gaji:sGaji(per), listrik:sBi(per,'Listrik'), perlengkapan:sBi(per,'Perlengkapan Kantor'), lainnya:sBi(per,'Lainnya') };
  out.totalBiaya = out.gaji + out.listrik + out.perlengkapan + out.lainnya;
  out.selisih = out.pendapatan - out.totalBiaya;
  out.biaya = bi.filter(b=>mon(b.tgl)===per);
  const y = Number(per.slice(0,4)), mo = Number(per.slice(5,7)), tren = [];
  for (let i=5;i>=0;i--) { const d = new Date(y, mo-1-i, 1), m = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); tren.push({ periode:m, pendapatan:sPay(m), biaya:sGaji(m)+sBi(m) }); }
  out.tren = tren;
  return out;
}

function api(fn, ...a) {
  document.body.classList.add('busy');
  return new Promise((ok, no) => {
    setTimeout(() => {

  });
}

  $('mbody').innerHTML = `<h3>Pendaftaran Siswa Baru</h3><form class="grid" onsubmit="kirimDaftar(event)">
      <label>Nama<input id="dn" required maxlength="80"></label><label>Email<input id="de" type="email" required></label>
      <label>No. HP<input id="dh" required></label>
      <label>Kelas<select id="dk">${data.map(k=>`<option value="${esc(k.kelas_id)}">${esc(k.nama_kelas)} — ${rp(k.biaya)}/bln</option>`).join('')}</select></label>
      <button class="btn">Daftar</button></form>`;
  $('modal').hidden = false;
}
function kirimDaftar(e) {
  e.preventDefault();
  const r = call('daftarPublik', [{ nama:$('dn').value, email:$('de').value, no_hp:$('dh').value, kelas_id:$('dk').value }]);
  toast(r.message, r.success?'':'err'); if (r.success) closeModal();
}

/* ── Ganti Password ── */
const pwd = (id,t) => `<label>${t}<input id="${id}" type="password" required minlength="8" autocomplete="new-password"></label>`;
function showGantiPw() {
  $('mbody').innerHTML = `<h3>Ganti Password</h3><form class="grid" onsubmit="kirimPw(event)">
    <label>Password lama<input id="pw0" type="password" required autocomplete="current-password"></label>${pwd('pw1','Password baru (min. 8 karakter)')}${pwd('pw2','Ulangi password baru')}
    <button class="btn">Simpan</button></form>`; $('modal').hidden = false;
}
function kirimPw(e) {
  e.preventDefault(); if ($('pw1').value !== $('pw2').value) return toast('Konfirmasi password tidak sama.','err');
  api('gantiPassword', $('pw0').value, $('pw1').value).then(r=>{ toast(r.message); closeModal(); }).catch(()=>{});
}

/* ── Rapor ── */
const raporBar = can => `<div class="card acts">${can
  ? '<button class="btn sec" onclick="rapor(false)"><i class="bi bi-file-earmark-pdf"></i> Unduh Rapor (siswa terpilih)</button><button class="btn" onclick="rapor(true)"><i class="bi bi-envelope"></i> Kirim Rapor ke Email</button>'
  : '<button class="btn" onclick="rapor(false)"><i class="bi bi-file-earmark-pdf"></i> Unduh Rapor Saya</button>'}</div>`;
function rapor(mail) {
  const sid = S.user.role==='siswa' ? S.user.ref_id : ($('ns')?$('ns').value:'S1');
  api(mail?'emailRapor':'unduhRapor', sid).then(r=>{ toast(r.message); }).catch(()=>{});
}

/* ── Materi & video ── */
R.materi = d => {
  const can = S.user.role !== 'siswa';
  const form = can ? `<div class="card"><h3>Tambah Materi</h3><form class="grid" onsubmit="addM(event)">
    <label>Kelas<select id="mk">${opt(d.kelas,'kelas_id','nama_kelas')}</select></label><label>Judul<input id="mj" required maxlength="100"></label>
    <label>Berkas PDF (maks 5 MB)<input id="mf" type="file" accept="application/pdf"></label>
    <label>atau tautan video/materi (https)<input id="mu" type="url" placeholder="https://..."></label>
    <label>atau unggah video ke Drive (MP4/MOV/WEBM, maks 300 MB)<input id="mv" type="file" accept="video/mp4,video/quicktime,video/webm,video/x-matroska"></label>
    <div id="vp" class="mut" style="grid-column:1/-1"></div><button class="btn">Simpan</button></form></div>` : '';
  $('app').innerHTML = form + `<div class="card"><h3>Materi & Video Kelas</h3>${search()}${table([['Tanggal',m=>esc(m.tgl)],['Judul',m=>esc(m.judul)],
    ['Kelas',m=>esc(m.kelas)],['Tipe',m=>`<span class="badge info">${esc(m.tipe)}</span>`],
    ['Buka',m=>/^https:\/\//.test(m.file_url)?`<a class="btn sec sm" href="${esc(m.file_url)}" target="_blank" rel="noopener">Buka</a>`:'-']].concat(S.user.role==='siswa'?[['Dipelajari',m=>(d.selesai||[]).includes(m.materi_id)?'<span class="badge ok">✓ Selesai</span>':`<button class="btn sm" onclick="tandaiM('${esc(m.materi_id)}')">Tandai selesai</button>`]]:[]), d.materi)}</div>`;
};
function addM(e) {
  e.preventDefault(); const f = $('mf').files[0], o = { kelas_id:$('mk').value, judul:$('mj').value, url:$('mu').value };
  const send = x => api('simpanMateri', x).then(r=>done(r,'materi')).catch(()=>{});
  if (!f) return send(o);
  if (f.size > 5*1024*1024) return toast('Ukuran PDF maksimal 5 MB.','err');
  const rd = new FileReader(); rd.onload = () => send(Object.assign(o, { b64:rd.result.split(',')[1], name:f.name, mime:f.type })); rd.readAsDataURL(f);
}

/* ── Pengaturan ── */
R.pengaturan = d => {
  $('app').innerHTML = `<div class="card"><h3>Pengaturan Umum</h3><form class="grid" onsubmit="saveCfg(event)">
    <label>Email kontak<input id="ce" type="email" value="${esc(d.cfg.email_kontak)}"></label>
    <label>Tanggal pengingat SPP (mis. 1,5,10)<input id="ch" value="${esc(d.cfg.hari_pengingat)}" required></label>
    <label>Batas konfirmasi lanjut bimbel (hari)<input id="cb2" type="number" min="1" max="99" value="${esc(d.cfg.batas_konfirmasi||'7')}" required></label>
    <button class="btn">Simpan</button><button type="button" class="btn sec" onclick="kirimIngat()">Kirim Pengingat Sekarang</button></form></div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3>Manajemen Akun</h3><button class="btn sm" onclick="addAdmin()"><i class="bi bi-plus-lg"></i> Tambah Admin</button></div>${search()}${table([
    ['Username',x=>esc(x.username)],['Nama',x=>(x.foto?`<img class="av" src="${esc(x.foto)}" alt=""> `:'')+esc(x.nama)],['Email',x=>esc(x.email)||'-'],['Peran',x=>esc(x.role)],['Status',x=>badge(x.status)],
    ['Aksi',x=>`<div class="acts"><button class="btn sec sm" onclick="editAkun('${esc(x.user_id)}')">Edit</button>${x.role==='admin'?'':`<button class="btn sec sm" onclick="resetPw('${esc(x.user_id)}')">Reset</button>`}${x.self?'':`<button class="btn bad sm" onclick="delAkun('${esc(x.user_id)}')">Hapus</button>`}</div>`]], d.users)}</div>
    <div class="card" id="drv"><h3>Penyimpanan Google Drive</h3><p class="mut">Mode demo: tautan ke Drive tidak aktif.</p></div>`;
  S.ak = Object.fromEntries(d.users.map(x=>[x.user_id,x]));

const saveCfg = e => { e.preventDefault(); api('simpanPengaturan', { email_kontak:$('ce').value, hari_pengingat:$('ch').value, batas_konfirmasi:$('cb2').value }).then(r=>done(r,'pengaturan')).catch(()=>{}); };
const kirimIngat = () => ask('Kirim email pengingat ke semua siswa aktif yang belum membayar bulan ini?', { title:'Kirim Pengingat SPP', ok:'Ya, kirim' }).then(y=>y && api('jalankanPengingat').then(r=>toast(r.message))).catch(()=>{});
const resetPw = id => ask('Kirim password baru ke email pengguna ini?', { title:'Reset Password', ok:'Ya, kirim' }).then(y=>y && api('resetPassword', id).then(r=>toast(r.message))).catch(()=>{});

/* ── Paket ── */
R.paket = d => {
  $('app').innerHTML = `<p class="mut" style="margin-bottom:16px">Pilih paket bimbel tambahan. Setelah disetujui admin, jadwal dan materinya muncul di akun Anda.</p>
    <div class="kpis">${d.kelas.map(k=>`<div class="kpi"><span>${esc(k.tipe)}</span><b style="font-size:18px">${esc(k.nama_kelas)}</b>
    <span>${rp(k.biaya)} / bulan</span>${poin(k.ringkasan)}${k.status==='tersedia'?`<button class="btn sm" onclick="ajukan('${esc(k.kelas_id)}')">Daftar Paket Ini</button>`
    :badge(k.status==='aktif'?'aktif':'menunggu')}</div>`).join('')}</div>`;
};
const ajukan = id => ask('Ajukan paket bimbel ini? Admin akan meninjau pengajuan Anda.', { title:'Ajukan Paket', ok:'Ya, ajukan' }).then(y=>y && api('ajukanPaket', id).then(r=>done(r,'paket'))).catch(()=>{});
const putus = (id,y) => api('putusPaket', id, y).then(r=>done(r,'siswa')).catch(()=>{});
const poin = t => { const a = String(t||'').split('\n').filter(x=>x.trim()); return a.length ? `<ul style="margin:0;padding-left:16px">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '<span class="mut">-</span>'; };

R.paketkelola = d => {
  S.pk = Object.fromEntries(d.kelas.map(k=>[k.kelas_id,k]));
  $('app').innerHTML = `<div class="card"><h3 id="pft">Tambah Paket Bimbel</h3><form class="grid" onsubmit="savePk(event)"><input type="hidden" id="pid">
    <label>Nama paket<input id="pnm" required maxlength="80"></label>
    <label>Tipe<select id="ptp"><option>Offline</option><option>Online</option></select></label>
    <label>Harga / bulan (Rp)<input id="phg" type="number" min="0" required></label>
    <label>Kuota siswa<input id="pkq" type="number" min="1" max="500" required></label>
    <label>Pengajar<select id="ppg">${opt(d.pengajar,'pengajar_id','nama')}</select></label>
    <label style="grid-column:1/-1">Ringkasan poin materi (satu poin per baris)<textarea id="prg" rows="4" maxlength="1500" placeholder="Aljabar &amp; fungsi&#10;Kalkulus dasar"></textarea></label>
    <button class="btn">Simpan Paket</button><button type="button" class="btn sec" onclick="go('paketkelola')">Batal</button></form></div>
    <div class="card"><h3>Daftar Paket Bimbel</h3>${search()}${table([['Paket',k=>`<b>${esc(k.nama_kelas)}</b><br><span class="badge info">${esc(k.tipe)}</span>`],
    ['Harga/bulan',k=>rp(k.biaya)],['Terisi',k=>`${k.terisi}/${k.kuota}`],['Pengajar',k=>esc(k.pengajar)],['Poin Materi',k=>poin(k.ringkasan)],
    ['Aksi',k=>`<div class="acts"><button class="btn sec sm" onclick="editPk('${esc(k.kelas_id)}')">Edit</button><button class="btn bad sm" onclick="delPk('${esc(k.kelas_id)}')">Hapus</button></div>`]], d.kelas)}</div>`;
};
function editPk(id) {
  const k = S.pk[id]; $('pid').value = id; $('pnm').value = k.nama_kelas; $('ptp').value = k.tipe; $('phg').value = k.biaya;
  $('pkq').value = k.kuota; $('ppg').value = k.pengajar_id; $('prg').value = k.ringkasan; $('pft').textContent = 'Edit Paket Bimbel'; $('pnm').focus();
}
const savePk = e => {
  e.preventDefault();
  api('simpanPaket', { kelas_id:$('pid').value, nama:$('pnm').value, tipe:$('ptp').value, harga:$('phg').value, kuota:$('pkq').value, pengajar_id:$('ppg').value, ringkasan:$('prg').value })
    .then(r=>done(r,'paketkelola')).catch(()=>{});
};
const delPk = id => ask('Hapus paket bimbel ini?', { title:'Hapus Paket', ok:'Ya, hapus', danger:true }).then(y=>y && api('hapusPaket', id).then(r=>done(r,'paketkelola'))).catch(()=>{});

/* ── Identitas ── */
function applyIdent(x) {
  if (!$('lbrand') || !$('sbrand')) return;
  const img = x.logo ? `<img src="${esc(x.logo)}" alt="Logo">` : '<i class="bi bi-mortarboard-fill logo"></i>';
  ['lbrand','sbrand'].forEach(id=>$(id).innerHTML = `${img}<span>${esc(x.nama_bimbel)}</span>`);
  $('lmoto').textContent = x.moto || 'Masuk untuk melanjutkan'; $('sbmoto').textContent = x.moto || '';
  const wa = x.whatsapp ? `<a href="https://wa.me/${esc(x.whatsapp)}" target="_blank" rel="noopener">WhatsApp: +${esc(x.whatsapp)}</a>` : '';
  $('lkontak').innerHTML = [esc(x.alamat), x.telepon?'Telp: '+esc(x.telepon):'', wa].filter(Boolean).join('<br>');
  document.title = x.nama_bimbel;
}
applyIdent(DB.identitas);
R.identitas = d => {
  $('app').innerHTML = `<div class="card"><h3>Identitas Bimbel</h3><p class="mut" style="margin-bottom:12px">Informasi ini tampil di halaman login, sidebar, kuitansi, rapor, dan email.</p>
    <form class="grid" onsubmit="saveIdent(event)">
    <label>Nama bimbel<input id="in" required maxlength="60" value="${esc(d.nama_bimbel)}"></label>
    <label>Moto / slogan<input id="im" maxlength="120" value="${esc(d.moto)}"></label>
    <label>No. telepon<input id="it" maxlength="20" value="${esc(d.telepon)}" placeholder="0281-123456"></label>
    <label>No. WhatsApp<input id="iw" maxlength="20" value="${esc(d.whatsapp?'0'+d.whatsapp.replace(/^62/,''):'')}" placeholder="0812xxxxxxx"></label>
    <label style="grid-column:1/-1">Alamat<textarea id="ia" rows="3" maxlength="200">${esc(d.alamat)}</textarea></label>
    <div style="grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <div class="lgprev logo" style="display:grid;place-items:center;font-size:36px"><i class="bi bi-mortarboard-fill"></i></div>
      <label>Logo (PNG/JPG/WEBP, maks 1 MB)<input id="il" type="file" accept="image/png,image/jpeg,image/webp"></label>
    </div>
    <button class="btn">Simpan Identitas</button></form></div>`;
};
function saveIdent(e) {
  e.preventDefault();
  const o = { nama_bimbel:$('in').value, moto:$('im').value, telepon:$('it').value, whatsapp:$('iw').value, alamat:$('ia').value, hapusLogo:false };
  api('simpanIdentitas', o).then(r=>{ applyIdent(r.data); done(r,'identitas'); }).catch(()=>{});
}

/* ── Akun ── */
function editAkun(id) {
  const x = S.ak[id];
  $('mbody').innerHTML = `<h3>Edit Akun ${esc(x.role)}</h3><form class="grid" onsubmit="saveAkun(event,'${esc(id)}')">
    <label>Nama<input id="an" required maxlength="80" value="${esc(x.nama)}"></label>
    <label>Username<input id="au" required pattern="[a-z0-9._-]{3,30}" value="${esc(x.username)}"></label>
    ${x.role==='admin'?'':`<label>Email<input id="ae" type="email" required value="${esc(x.email)}"></label>`}
    ${x.role==='siswa'?`<label>No. HP<input id="ah" maxlength="20" value="${esc(x.no_hp)}"></label>`:''}
    <label>Status<select id="as"${x.self?' disabled':''}><option value="aktif"${x.status==='aktif'?' selected':''}>Aktif</option><option value="nonaktif"${x.status!=='aktif'?' selected':''}>Nonaktif</option></select></label>
    <button class="btn">Simpan</button></form>`;
  $('modal').hidden = false;
}
function saveAkun(e, id) {
  e.preventDefault();
  api('editAkun', { user_id:id, nama:$('an').value, username:$('au').value, email:$('ae')?$('ae').value:'', no_hp:$('ah')?$('ah').value:'', status:$('as').value })
    .then(r=>{ closeModal(); if (r.data.self) { S.user.nama = r.data.nama; $('who').textContent = r.data.nama + ' · ' + ROLELABEL[S.user.role]; } done(r,'pengaturan'); }).catch(()=>{});
}
function delAkun(id) {
  const x = S.ak[id];
  ask(`Hapus akun ${x.nama} (${x.role})?`, { title:'Hapus Akun', ok:'Ya, hapus', danger:true }).then(y=>y && api('hapusAkun', id).then(r=>done(r,'pengaturan'))).catch(()=>{});
}
function addAdmin() {
  $('mbody').innerHTML = `<h3>Tambah Admin</h3><form class="grid" onsubmit="saveAdmin(event)">
    <label>Nama<input id="nn" required maxlength="80"></label>
    <label>Username<input id="nu" required pattern="[a-z0-9._-]{3,30}"></label>
    ${pwd('np','Password (min. 8 karakter)')}<button class="btn">Tambah</button></form>`;
  $('modal').hidden = false;
}
function saveAdmin(e) {
  e.preventDefault();
  api('tambahAdmin', { nama:$('nn').value, username:$('nu').value, password:$('np').value }).then(r=>{ closeModal(); done(r,'pengaturan'); }).catch(()=>{});
}

/* ── Kuitansi ── */
function dl(f) { if (!f.b64) return toast('Mode demo: tidak ada berkas nyata.','err'); const a = document.createElement('a'); a.href = 'data:application/pdf;base64,'+f.b64; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }
const unduhKw = id => api('unduhKuitansi', id).then(r=>dl(r.data)).catch(()=>{});
const emailKw = id => ask('Kirim kuitansi PDF ke email siswa ini?', { title:'Kirim Kuitansi', ok:'Ya, kirim' }).then(y=>y && api('emailKuitansi', id).then(r=>toast(r.message))).catch(()=>{});
function waKw(id) {
  api('waKuitansi', id).then(r=>{
    const d = r.data; if (!/^https:\/\/wa\.me\//.test(d.url)) return;
    $('mbody').innerHTML = `<h3><i class="bi bi-whatsapp"></i> Kirim Kuitansi via WhatsApp</h3>
      <p class="mut">Ke: <b>${esc(d.nama)}</b> (+${esc(d.no)}). Pesan berikut akan terisi otomatis di WhatsApp:</p>
      <textarea readonly rows="5">${esc(d.pesan)}</textarea>
      <a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener" onclick="closeModal()">Buka WhatsApp</a>
      <p class="mut" style="font-size:12px">Mode demo: kuitansi tidak dilampirkan.</p>`;
    $('modal').hidden = false;
  }).catch(()=>{});
}
function cetakKw(id) {
  api('unduhKuitansi', id).then(r=>{
    const f = r.data; if (!f.b64) return toast('Mode demo: PDF tidak tersedia.','err');
  }).catch(()=>{});
}
const kwCard = p => `<div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
  <i class="bi bi-receipt-cutoff" style="font-size:30px;color:var(--pri)"></i>
  <div style="flex:1;min-width:220px"><b>Kuitansi Pembayaran SPP ${esc(p.periode)}</b><br>
  <span class="mut">Pembayaran ${rp(p.jumlah)} tanggal ${esc(p.tgl)} sudah diverifikasi (LUNAS). Kuitansi siap dicetak.</span></div>
  <div class="acts"><button class="btn sm" onclick="cetakKw('${esc(p.bayar_id)}')"><i class="bi bi-printer"></i> Cetak</button>
  <button class="btn sec sm" onclick="unduhKw('${esc(p.bayar_id)}')"><i class="bi bi-download"></i> Unduh PDF</button></div></div>`;
R.kuitansi = d => {
  $('app').innerHTML = d.pay.length ? '<p class="mut" style="margin-bottom:12px">Kuitansi dibuat otomatis setiap pembayaran Anda diverifikasi admin.</p>' + d.pay.map(kwCard).join('')
    : '<div class="card empty">Belum ada kuitansi.</div>';
};

/* ── Selesai Bimbel ── */
const SBB = { berjalan:['info','Berjalan'], menunggu:['warn','Menunggu Konfirmasi'], lanjut:['ok','Lanjut'], selesai:['ok','Selesai'] };
const sbBadge = s => { const b = SBB[s]||['info',s]; return `<span class="badge ${b[0]}">${esc(b[1])}</span>`; };
const bar = (a,b) => `<div style="height:8px;background:var(--bd);border-radius:99px;margin:6px 0"><div style="height:100%;width:${b?Math.round(a/b*100):0}%;background:var(--pri);border-radius:99px"></div></div>`;
R.selesai = d => {
  if (S.user.role === 'admin') {
    $('app').innerHTML = `<div class="card"><h3>Selesai Bimbel</h3><p class="mut" style="margin-bottom:12px">Siswa masuk daftar ini setelah semua materi dipelajari dan Tes Akhir dilaksanakan. Tanpa konfirmasi lanjut dalam ${esc(d.batas)} hari, bimbel otomatis dinyatakan selesai.</p>${search()}${table([
      ['Siswa',r=>esc(r.nama)],['Paket',r=>esc(r.kelas)],['Status',r=>sbBadge(r.status)],['Syarat terpenuhi',r=>esc(r.tgl_memenuhi)],
      ['Batas konfirmasi',r=>r.sisa_hari==null?'-':r.sisa_hari+' hari lagi'],['Selesai',r=>esc(r.tgl_selesai)||'-'],
      ['Aksi',r=>r.status==='menunggu'?`<button class="btn sm" onclick="selesaikanA('${esc(r.sb_id)}')">Selesaikan</button>`:'']], d.rec)}</div>`;
    return;
  }
  $('app').innerHTML = d.paket.length ? d.paket.map(p=>{
    const tes = p.tes==null ? '<span class="badge warn">Belum dilaksanakan</span>' : `<span class="badge ok">Skor ${esc(p.tes)}</span>`;
    let aksi = '';
    if (p.status === 'berjalan') aksi = '<p class="mut">Tandai semua materi sebagai selesai dipelajari (menu Materi & Video) dan ikuti Tes Akhir dari pengajar untuk menyelesaikan bimbel.</p>';
    else if (p.status === 'menunggu') aksi = `<div class="card ins" style="margin:12px 0 0;flex-direction:column;align-items:flex-start"><b>Materi dan Tes Akhir sudah selesai. Apakah Anda ingin melanjutkan bimbel?</b>
      <span class="mut">Jika tidak ada konfirmasi dalam <b>${esc(p.sisa_hari)} hari</b> lagi, bimbel otomatis dinyatakan selesai.</span>
      <div class="acts"><button class="btn" onclick="jawab('${esc(p.kelas_id)}',true)">Lanjutkan Bimbel</button><button class="btn sec" onclick="jawab('${esc(p.kelas_id)}',false)">Selesaikan Bimbel</button></div></div>`;
    else if (p.status === 'lanjut') aksi = '<p>Anda memilih <b>melanjutkan</b>. Pilih paket lanjutan di <a href="#" onclick="go(\'paket\');return false">Tambah Paket Bimbel</a>.</p>';
    else aksi = `<p>🎓 Bimbel <b>selesai</b> pada ${esc(p.tgl_selesai)}. Terima kasih!</p><button class="btn sec sm" onclick="rapor(false)"><i class="bi bi-file-earmark-pdf"></i> Unduh Rapor</button>`;
    return `<div class="card"><h3>${esc(p.nama)} ${sbBadge(p.status)}</h3>
      <div>Materi dipelajari: <b>${p.selesai}/${p.total}</b></div>${bar(p.selesai,p.total)}<div style="margin:8px 0">Tes Akhir: ${tes}</div>${aksi}</div>`;
  }).join('') : '<div class="card empty">Belum ada paket bimbel.</div>';
};
const tandaiM = id => api('tandaiMateri', id).then(r=>done(r,'materi')).catch(()=>{});
const jawab = (kid,lanjut) => ask(lanjut?'Lanjutkan bimbel?':'Yakin menyelesaikan bimbel?', { title:lanjut?'Lanjutkan Bimbel':'Selesaikan Bimbel', ok:lanjut?'Ya, lanjutkan':'Ya, selesaikan', danger:!lanjut }).then(y=>y && api('jawabSelesai', kid, lanjut).then(r=>done(r,'selesai'))).catch(()=>{});
const selesaikanA = id => ask('Nyatakan bimbel siswa ini selesai?', { title:'Selesaikan Bimbel Siswa', ok:'Ya, selesaikan' }).then(y=>y && api('selesaikanAdmin', id).then(r=>done(r,'selesai'))).catch(()=>{});

/* ── Chat ── */
const quiet = (fn, ...a) => new Promise((ok,no)=>{ const r = call(fn, a); r.success ? ok(r) : no(r); });
const chatErr = e => { if (e && /Sesi berakhir/.test(e.message||'')) logout(true); };
const fmtT = w => w ? new Date(w).toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
R.chat = () => {
  S.th = null; S.lastKey = ''; S.tk = 0;
  $('app').innerHTML = `<div class="chat"><div class="cl" id="cl"><div class="empty">Memuat kontak...</div></div>
    <div class="cm"><div class="ch" id="chh">Pilih percakapan</div><div class="cb" id="cb"></div>
    <form class="cf" onsubmit="kirimChat(event)"><input id="ci" placeholder="Tulis pesan..." maxlength="1000" autocomplete="off" disabled><button class="btn" id="cbtn" disabled><i class="bi bi-send"></i></button></form></div></div>`;
  loadKontak(true); S.ct = setInterval(()=>{ if (document.hidden) return; loadPesan(); if (++S.tk % 3 === 0) loadKontak(); }, 7000);
};
function loadKontak(first) {
  quiet('kontakChat').then(r=>{ S.kontak = r.data; renderKontak(); if (first && !S.th && r.data.length && window.innerWidth > 900) openChat(r.data[0].thread); }).catch(chatErr);
}
function renderKontak() {
  const el = $('cl'); if (!el) return;
  el.innerHTML = (S.kontak||[]).length ? S.kontak.map(c=>`<div class="ci${c.thread===S.th?' on':''}" onclick="openChat('${esc(c.thread)}')">
    <div style="display:flex;gap:6px;align-items:center"><b>${esc(c.nama)}</b><span class="badge info">${esc(c.role)}</span>${c.belum?`<span class="badge bad2" style="margin-left:auto">${c.belum}</span>`:''}</div>
    <small class="mut">${esc(c.terakhir)||'Belum ada pesan'}</small></div>`).join('') : '<div class="empty">Belum ada kontak.</div>';
}
function openChat(th) {
  S.th = th; S.lastKey = ''; const c = (S.kontak||[]).find(x=>x.thread===th);
  $('chh').textContent = c ? c.nama + ' · ' + c.role : ''; $('ci').disabled = false; $('cbtn').disabled = false; renderKontak(); loadPesan(); $('ci').focus();
}
const bubble = m => `<div class="bub${m.mine?' me':''}"><small>${esc(m.dari)} · ${fmtT(m.waktu)}</small>${esc(m.isi)}</div>`;
function loadPesan() {
  if (!S.th) return;
  quiet('ambilPesan', S.th).then(r=>{
    const p = r.data.pesan, key = p.length + ':' + (p.length?p[p.length-1].id:''), b = $('cb');
    if (!b || key === S.lastKey) return; S.lastKey = key;
    b.innerHTML = p.length ? p.map(bubble).join('') : '<div class="empty">Belum ada pesan. Mulai percakapan!</div>'; b.scrollTop = b.scrollHeight; loadKontak();
  }).catch(chatErr);
}
function kirimChat(e) {
  e.preventDefault(); const v = $('ci').value.trim(); if (!v || !S.th) return; $('ci').value = '';
  api('kirimPesan', S.th, v).then(()=>loadPesan()).catch(()=>{ $('ci').value = v; });
}
function startBadge() {
  clearInterval(S.cb);
  const f = () => quiet('jmlUnread').then(r=>{
    const a = document.querySelector('#nav a[data-p="chat"]'); if (!a) return; let b = a.querySelector('.badge');
    if (r.data > 0) { if (!b) { b = document.createElement('span'); b.className = 'badge bad2'; b.style.marginLeft = 'auto'; a.appendChild(b); } b.textContent = r.data; } else if (b) b.remove();
  }).catch(chatErr);
  f(); S.cb = setInterval(f, 30000);
}

/* ── Navigasi sidebar ── */
function renderNav() {
  const a = m => `<a data-p="${m[0]}" onclick="go('${m[0]}')"><i class="bi ${m[2]}"></i><span>${esc(m[1])}</span></a>`;
  $('nav').innerHTML = NAV[S.user.role].map(x => x.items
    ? `<div class="ng"><button class="gh" onclick="this.parentElement.classList.toggle('open')"><i class="bi ${x.i}"></i><span>${esc(x.g)}</span><i class="bi bi-chevron-down chev"></i></button><div class="gi">${x.items.map(a).join('')}</div></div>`
    : a(x)).join('');
}
function toggleUM(e) { e.stopPropagation(); const m = $('umenu'); m.hidden = !m.hidden; }
document.addEventListener('click', ()=>{ const m = $('umenu'); if (m) m.hidden = true; });

/* ── Dialog konfirmasi ── */
function ask(msg, o = {}) {
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'modal'; ov.style.zIndex = 70;
    ov.innerHTML = `<div class="mc" style="max-width:440px"><h3>${esc(o.title||'Konfirmasi')}</h3><p>${esc(msg)}</p>
      <div class="acts" style="justify-content:flex-end"><button class="btn sec" data-r="0">Batal</button><button class="btn${o.danger?' danger':''}" data-r="1">${esc(o.ok||'Ya, lanjutkan')}</button></div></div>`;
    const end = v => { document.removeEventListener('keydown', key); ov.remove(); resolve(v); };
    const key = e => { if (e.key === 'Escape') end(false); };
    ov.onclick = e => { if (e.target === ov) end(false); else if (e.target.dataset && e.target.dataset.r) end(e.target.dataset.r === '1'); };
    document.addEventListener('keydown', key); document.body.appendChild(ov);
    const b = ov.querySelector(o.danger ? '[data-r="0"]' : '[data-r="1"]'); if (b) b.focus();
  });
}

/* ── Gaji ── */
const rekCell = g => g.no_rekening ? `<b>${esc(g.bank)}</b> ${esc(g.no_rekening)}<br><span class="mut">a.n. ${esc(g.atas_nama)}</span>` : '<span class="badge warn">Belum diisi</span>';
R.gaji = d => {
  S.gj = Object.fromEntries(d.gaji.map(g=>[g.pengajar_id,g])); S.gjp = d.periode;
  $('app').innerHTML = `<div class="card"><h3>Gaji Pengajar <span class="pill">Periode ${esc(d.periode)}</span></h3>
    <p class="mut" style="margin-bottom:12px">Sesi per bulan = jadwal mingguan × 4. Jumlah ditransfer = sesi × tarif.</p>${table([
    ['Pengajar',g=>`<b>${esc(g.nama)}</b><br><span class="mut">${esc(g.mapel||'')}</span>`],['Rekening tujuan',rekCell],['Sesi',g=>g.sesi],['Tarif/sesi',g=>rp(g.tarif)],
    ['Jumlah ditransfer',g=>`<b>${rp(g.total)}</b>`],['Status',g=>badge(g.status)],
    ['Aksi',g=>g.status==='belum'?`<button class="btn sm" onclick="bayarGaji('${esc(g.pengajar_id)}')"><i class="bi bi-bank"></i> Transfer & Upload Bukti</button>`
      :`<span class="mut">${esc(g.tgl_bayar)}</span>`]], d.gaji)}
    <p style="margin-top:12px"><b>Total gaji bulan ini: ${rp(d.gaji.reduce((a,g)=>a+g.total,0))}</b></p></div>`;
};
function bayarGaji(id) {
  const g = S.gj[id];
  if (!g.no_rekening) return toast('Lengkapi nomor rekening pengajar dulu.','err');
  $('mbody').innerHTML = `<h3>Transfer Gaji — ${esc(g.nama)}</h3>
    <div class="card" style="margin:0"><div class="mut">Bank</div><b>${esc(g.bank)}</b>
      <div class="mut" style="margin-top:8px">Nomor rekening</div><div style="display:flex;gap:8px;align-items:center"><b style="font-size:18px;letter-spacing:.05em">${esc(g.no_rekening)}</b><button type="button" class="btn sec sm" onclick="salin('${esc(g.no_rekening)}')">Salin</button></div>
      <div class="mut" style="margin-top:8px">Atas nama</div><b>${esc(g.atas_nama)}</b>
      <div class="mut" style="margin-top:8px">Jumlah yang harus ditransfer</div><b style="font-size:22px;color:var(--pri)">${rp(g.total)}</b></div>
    <form class="grid" onsubmit="kirimGaji(event,'${esc(id)}')"><label style="grid-column:1/-1">Bukti transfer (JPG/PNG/PDF) — wajib<input id="gb" type="file" required></label>
    <button class="btn" style="grid-column:1/-1">Simpan sebagai Dibayar</button></form>`;
  $('modal').hidden = false;
}
const salin = t => { if (navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('Nomor rekening disalin.')).catch(()=>toast('Salin manual: '+t)); else toast('Salin manual: '+t); };
function kirimGaji(e, id) {
  e.preventDefault(); const f = $('gb').files[0];
  if (!f) return toast('Bukti transfer wajib diunggah.','err');
  api('bayarGaji', { pengajar_id:id, b64:'', mime:f.type, name:f.name }).then(r=>{ closeModal(); done(r,'gaji'); }).catch(()=>{});
}

/* ── Rekening ── */
function rekForm(p, id) {
  $('mbody').innerHTML = `<h3>Rekening Bank${p.nama?' — '+esc(p.nama):''}</h3><form class="grid" onsubmit="saveRek(event,'${esc(id)}')">
    <label>Bank<input id="rb" required maxlength="30" value="${esc(p.bank||'')}" placeholder="BCA / Mandiri / BNI"></label>
    <label>Nomor rekening<input id="rn" required inputmode="numeric" maxlength="24" value="${esc(p.no_rekening||'')}"></label>
    <label>Atas nama<input id="ra" required maxlength="60" value="${esc(p.atas_nama||'')}"></label><button class="btn">Simpan</button></form>`;
  $('modal').hidden = false;
}
const rekModal = id => rekForm(S.pgm[id], id);
const showRekening = () => api('getRekening').then(r=>rekForm(r.data,'')).catch(()=>{});
function saveRek(e, id) {
  e.preventDefault();
  api('simpanRekening', { pengajar_id:id, bank:$('rb').value, no_rekening:$('rn').value, atas_nama:$('ra').value })
    .then(r=>{ closeModal(); toast(r.message); if (S.page==='pengajar') go('pengajar'); }).catch(()=>{});
}

/* ── Laporan ── */
const gantiLap = per => api('getLaporan', per).then(r=>R.laporan(r.data)).catch(()=>{});
const pdfLap = () => toast('Mode demo: unduh PDF tidak tersedia.','err');
R.laporan = d => {
  S.bi = Object.fromEntries(d.biaya.map(b=>[b.biaya_id,b]));
  const row = (l,v,cls) => `<tr${cls?` class="${cls}"`:''}><td>${l}</td><td style="text-align:right">${rp(v)}</td></tr>`, plus = d.selisih >= 0;
  const hari = d.periode + '-01';
  $('app').innerHTML = `<div class="card"><div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap"><h3 style="margin:0;flex:1">Laporan Keuangan</h3>
    <label>Periode<input id="lp" type="month" value="${esc(d.periode)}" onchange="gantiLap(this.value)"></label>
    <button class="btn sec" onclick="pdfLap()"><i class="bi bi-file-earmark-pdf"></i> Unduh PDF</button></div>
    <div class="tw" style="margin-top:12px"><table class="lap"><tbody>
      <tr><th colspan="2">PENDAPATAN</th></tr>${row('Pendapatan SPP (terverifikasi)', d.pendapatan)}
      <tr><th colspan="2">BIAYA</th></tr>${row('Biaya Gaji Pengajar', d.gaji)}${row('Biaya Listrik', d.listrik)}${row('Biaya Perlengkapan Kantor', d.perlengkapan)}${row('Biaya Lainnya', d.lainnya)}${row('Total Biaya', d.totalBiaya, 'tot')}
      <tr class="tot"><td>${plus?'SURPLUS (Laba)':'DEFISIT (Rugi)'}</td><td style="text-align:right;color:${plus?'#15803D':'#B91C1C'}">${rp(Math.abs(d.selisih))}</td></tr></tbody></table></div></div>
    <div class="card"><h3>Pendapatan vs Biaya (6 bulan terakhir)</h3><div class="cv"><canvas id="lc"></canvas></div></div>
    <div class="card"><h3 id="bft">Catat Biaya Operasional</h3><form class="grid" onsubmit="saveBiaya(event)"><input type="hidden" id="bid">
      <label>Tanggal<input id="btg" type="date" required value="${esc(hari)}"></label>
      <label>Kategori<select id="bkt"><option>Listrik</option><option>Perlengkapan Kantor</option><option>Lainnya</option></select></label>
      <label>Keterangan<input id="bke" required maxlength="120"></label><label>Jumlah (Rp)<input id="bjm" type="number" min="1" required></label>
      <label>Bukti/nota (opsional)<input id="bbf" type="file" accept="image/jpeg,image/png,application/pdf"></label>
      <button class="btn">Simpan</button><button type="button" class="btn sec" onclick="gantiLap($('lp').value)">Batal</button></form></div>
    <div class="card"><h3>Rincian Biaya Operasional — ${esc(d.periode)}</h3>${table([['Tanggal',b=>esc(b.tgl)],['Kategori',b=>`<span class="badge info">${esc(b.kategori)}</span>`],
      ['Keterangan',b=>esc(b.keterangan)],['Jumlah',b=>rp(b.jumlah)],
      ['Bukti',b=>b.bukti_url?`<button class="btn sec sm" data-u="${esc(b.bukti_url)}" onclick="preview(this.dataset.u)">Lihat</button>`:'-'],
      ['Aksi',b=>`<div class="acts"><button class="btn sec sm" onclick="editBiaya('${esc(b.biaya_id)}')">Edit</button><button class="btn bad sm" onclick="delBiaya('${esc(b.biaya_id)}')">Hapus</button></div>`]], d.biaya)}</div>`;
  if (S.chart2) S.chart2.destroy();
  const cs = getComputedStyle(document.documentElement), mut = cs.getPropertyValue('--mut').trim();
  S.chart2 = new Chart($('lc'), { type:'bar', data:{ labels:d.tren.map(t=>t.periode), datasets:[
    { label:'Pendapatan SPP', data:d.tren.map(t=>t.pendapatan), backgroundColor:cs.getPropertyValue('--teal').trim(), borderRadius:6 },
    { label:'Total Biaya', data:d.tren.map(t=>t.biaya), backgroundColor:cs.getPropertyValue('--pri').trim(), borderRadius:6 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ color:mut } } }, scales:{ x:{ ticks:{ color:mut } }, y:{ ticks:{ color:mut, callback:v=>v.toLocaleString('id-ID') } } } } });
};
function editBiaya(id) {
  const b = S.bi[id]; $('bid').value = id; $('btg').value = b.tgl; $('bkt').value = b.kategori; $('bke').value = b.keterangan; $('bjm').value = b.jumlah;
  $('bft').textContent = 'Edit Biaya Operasional'; $('bke').focus();
}
function saveBiaya(e) {
  e.preventDefault(); const f = $('bbf').files[0], per = $('lp').value;
  const o = { biaya_id:$('bid').value, tgl:$('btg').value, kategori:$('bkt').value, keterangan:$('bke').value, jumlah:$('bjm').value };
  api('simpanBiaya', o).then(r=>{ toast(r.message); gantiLap(per); }).catch(()=>{});
}
const delBiaya = id => ask('Hapus catatan biaya ini?', { title:'Hapus Biaya', ok:'Ya, hapus', danger:true }).then(y=>y && api('hapusBiaya', id).then(r=>{ toast(r.message); gantiLap($('lp').value); })).catch(()=>{});

/* ── Helper foto ── */
function setAv() {
  const a = $('av'), i = $('avi'), has = !!(S.user && S.user.foto);
  if (has) a.src = S.user.foto; a.hidden = !has; if (i) i.hidden = has;
}
function showFoto() {
  $('mbody').innerHTML = `<h3>Foto Profil</h3>
    <form class="grid" onsubmit="kirimFoto(event)"><label>Pilih foto (PNG/JPG/WEBP, maks 1 MB)<input id="fp" type="file" required accept="image/png,image/jpeg,image/webp"></label>
    <button class="btn">Unggah</button></form>`;
  $('modal').hidden = false;
}
function kirimFoto(e) { e.preventDefault(); closeModal(); toast('Mode demo: foto tidak disimpan.'); }
</script>
